# 两只 DS3230MG + 两只位置型 SG90，通过 STM32 PWM 控制
can_device: can0
arm_can_id: 0x701
arm_ack_timeout_s: 0.5

# 相对 STM32 校准零位的绝对目标，单位度；15度只是联调默认，不是正式放药标定。
# 按键验证后分别标定两只伸出/收回位置；镜像方向在 STM32 配置中设置。
arm_place_angle_1: 15.0
arm_place_angle_2: 15.0
arm_home_angle_1: 0.0
arm_home_angle_2: 0.0
arm_move_timeout_s: 3.0 # ACK后等待机械动作的时间，不是到位反馈
# 完整四步始终收回；保留旧参数字段以兼容，但正式流程固定回程。
default_reset_arm: true

# 与实测启动目标180度一致：关闭=180；打开=0。安装开/关相反时修改这里。
servo_hold_duration_s: 1.0
old_servo_open_angle: 0
old_servo_close_angle: 180
old_servo_move_duration_s: 0.5
old_servo_return_duration_s: 1.0
new_servo_open_angle: 0
new_servo_close_angle: 180
new_servo_move_duration_s: 0.5
new_servo_return_duration_s: 1.0

# 正式任务调用 /arm_place_medicine，禁止微调完成消息重复触发。
auto_start_on_fine_tuning: false
