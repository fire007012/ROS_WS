arm:
  # STM32_Motor_Controller: index 4 / CAN2 address 5 is the single arm axis.
  joint_count: 1
  joint_names: [joint_1]

  # 下面参数可作为后续 MoveIt / 控制器配置输入
  velocity_limits: [1.2]   # rad/s, configure to actual mechanism
  position_limits_lower: [-3.14]
  position_limits_upper: [3.14]

  # 示例 DH 参数（按实际机构替换）
  dh:
    a: [0.0]
    alpha: [0.0]
    d: [0.0]
    theta_offset: [0.0]
