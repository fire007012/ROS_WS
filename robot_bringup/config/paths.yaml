# 原始场地坐标单位为 mm；下列 ROS 坐标单位为 m，frame_id=odom。
# P0 为原点，启动时车头朝护士台：+x 朝护士台，+y 朝场地左侧。
# x=(场地Y_mm-500)/1000，y=(3500-场地X_mm)/1000，yaw=0 朝护士台。
# 坐标为建议值，尚未依据实测障碍物轮廓验证净空。
waypoints:
  P0:  &P0  {x: 0.0, y: 0.0, tolerance: 0.02, yaw: 0.0}
  P1:  &P1  {x: 1.3, y: 0.0, tolerance: 0.02, yaw: 0.0}
  P1_PASS: &P1_PASS {x: 1.3, y: 0.0, tolerance: 0.05}  # 仅经过 QR 通道，无需扫码朝向。
  P2L: &P2L {x: 2.0, y: 1.1, tolerance: 0.05}
  P2R: &P2R {x: 2.0, y: -1.1, tolerance: 0.05}
  P3L: &P3L {x: 3.0, y: 2.0, tolerance: 0.05}
  P3R: &P3R {x: 3.0, y: -2.0, tolerance: 0.05}
  P4:  &P4  {x: 4.0, y: 2.2, tolerance: 0.02, yaw: 0.0}
  P6:  &P6  {x: 4.0, y: -2.2, tolerance: 0.02, yaw: 0.0}
  P7:  &P7  {x: 1.0, y: 0.0, tolerance: 0.03}
  P8:  &P8  {x: 0.0, y: 0.0, tolerance: 0.02}

paths:
  - name: "nurse_station"
    description: "P0 → P1，车头朝护士台二维码"
    points:
      - *P0
      - *P1

  - name: "bed1_circle"
    description: "P1 → P2L → P3L → P4，护士台左侧绕行"
    points:
      - *P1
      - *P2L
      - *P3L
      - *P4

  - name: "bed3_circle"
    description: "P1 → P2R → P3R → P6，护士台右侧绕行"
    points:
      - *P1
      - *P2R
      - *P3R
      - *P6

  - name: "bed1_to_bed3"
    description: "P4 → P3L → P3R → P6，先退出停靠圈再走横向通道"
    blocked_point_index: 2  # 从 0 起计，保护 P3L → P3R；遇障先停稳再走 P1。
    fallback_path: "bed1_to_bed3_via_p1"
    points:
      - *P4
      - *P3L
      - *P3R
      - *P6

  - name: "bed3_to_bed1"
    description: "P6 → P3R → P3L → P4，先退出停靠圈再走横向通道"
    blocked_point_index: 2
    fallback_path: "bed3_to_bed1_via_p1"
    points:
      - *P6
      - *P3R
      - *P3L
      - *P4

  # 中间 cross passage 遇障时，从当前位置沿原通道返回入口，
  # 再经护士台 P1（QR 扫码位置）的通道到另一侧；只经过，不重复扫码。
  - name: "bed1_to_bed3_via_p1"
    description: "退回 P3L → P2L → P1 → P2R → P3R → P6"
    points:
      - *P3L
      - *P2L
      - *P1_PASS
      - *P2R
      - *P3R
      - *P6

  - name: "bed3_to_bed1_via_p1"
    description: "退回 P3R → P2R → P1 → P2L → P3L → P4"
    points:
      - *P3R
      - *P2R
      - *P1_PASS
      - *P2L
      - *P3L
      - *P4

  - name: "HOME"
    description: "仅适用于已到达 P7 的车辆：P7 → P8"
    points:
      - *P7
      - *P8

  - name: "bed1_to_home"
    description: "P4 → P3L → P2L → P7 → P8，左侧绕回"
    points:
      - *P4
      - *P3L
      - *P2L
      - *P7
      - *P8

  - name: "bed3_to_home"
    description: "P6 → P3R → P2R → P7 → P8，右侧绕回"
    points:
      - *P6
      - *P3R
      - *P2R
      - *P7
      - *P8

  # ── 通用测试路径 ──
  - name: "medicine_rack"
    points:
      - {x: 1.0, y: 0.0, tolerance: 0.05}
      - {x: 1.5, y: 0.5, tolerance: 0.05}
      - {x: 2.0, y: 0.0, tolerance: 0.05}

  - name: "charging_station"
    points:
      - {x: 0.0, y: 0.0, tolerance: 0.05}
      - {x: -0.5, y: -0.3, tolerance: 0.08}
      - {x: -0.5, y: -0.8, tolerance: 0.05}

  - name: "patrol_loop"
    points:
      - {x: 0.0, y: 0.0, tolerance: 0.05}
      - {x: 2.0, y: 0.0, tolerance: 0.05}
      - {x: 2.0, y: 1.5, tolerance: 0.05}
      - {x: 0.0, y: 1.5, tolerance: 0.05}
      - {x: 0.0, y: 0.0, tolerance: 0.05}
