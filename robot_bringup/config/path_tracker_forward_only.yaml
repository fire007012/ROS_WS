# 四路测距车辆：到下一点前先转向，再沿车头正向行驶。
# 任务 launch 另加载 range_avoidance.yaml，遇障碍时允许全向底盘横移绕行。
control_rate_hz: 30.0
kp_linear: 0.8
kp_angular: 1.5
max_linear_vel: 0.25
max_angular_vel: 0.5
position_tolerance: 0.05
heading_tolerance: 0.08
arrival_hold_time: 0.5
odom_timeout_sec: 0.5
use_holonomic: false
use_turn_then_move: true
