# ── 路径跟踪控制器参数 ─────────────────────────────────────
# 此文件由 path_tracker.launch 加载

# 控制循环频率 (Hz)
control_rate_hz: 30.0

# ── 比例控制器增益 ──
kp_linear: 0.8        # 线速度比例增益
kp_angular: 1.5       # 角速度比例增益

# ── 速度限制（会被 /robot/max_* 覆盖，此处为后备值） ──
max_linear_vel: 0.25  # 最大平移速度 (m/s)
max_angular_vel: 0.5  # 最大角速度 (rad/s)

# ── 到达判定 ──
position_tolerance: 0.05   # 默认位置容差 (m)，会被路径点自带的 tolerance 覆盖
heading_tolerance: 0.08    # 朝向对齐容差 (rad)，也用于带 yaw 的航点
arrival_hold_time: 0.5     # 到达后稳定保持时间 (s)

# ── 控制策略 ──
# 全向轮平移：保持航点 yaw，允许横移和倒退；优先于 use_turn_then_move。
use_holonomic: true
# 非全向模式下：true 先转向后前进，false 同时控制。
use_turn_then_move: false
