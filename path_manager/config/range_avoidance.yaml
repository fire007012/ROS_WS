# Four chassis VL53 beams + odometry, for an omnidirectional chassis.
# All distance thresholds use body-edge clearance, not raw sensor range.
# Only fresh, valid detections trigger avoidance. Missing returns do not stop travel.
range_avoidance:
  enabled: true
  front_range_topic: /front/range
  left_range_topic: /left/range
  right_range_topic: /right/range
  rear_range_topic: /rear/range
  trigger_m: 0.70
  front_clear_m: 0.90
  # Must exceed the independent brake threshold + release hysteresis at speed_mps.
  motion_clearance_m: 0.40
  side_space_m: 0.80
  min_offset_m: 0.70  # 0.25 m body + 0.25 m cone radius + 0.20 m nominal reserve.
  edge_margin_m: 0.35
  pass_margin_m: 0.45
  obstacle_length_m: 0.50  # Confirmed cone base diameter; remembered extent along travel.
  wall_detect_m: 1.30
  max_offset_m: 1.25
  max_forward_m: 3.0
  speed_mps: 0.12
  timeout_sec: 45.0
  stall_sec: 6.0
  range_timeout_sec: 0.20
  clear_hold_sec: 0.25
  settle_sec: 0.25
  line_tolerance_m: 0.03
  heading_tolerance_rad: 0.15
  prefer_left: true
