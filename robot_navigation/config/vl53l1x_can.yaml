# STM32 range-sensor CAN bridge. sensor_id 0 is front HC-SR04 ultrasound;
# sensor_id 1 and 2 are the left/right VL53L1X ToF modules. Protocol IDs are
# fixed by the STM32 firmware, but remain configurable for a CAN gateway.
can_interface: can0
distance_can_id: 0x110
diagnostic_can_id: 0x111
poll_rate_hz: 200
sensor_timeout_ms: 200

front:
  name: front_hc_sr04
  range_topic: /front/range
  distance_topic: /vl53l1x_distance
  frame_id: front_range_link
  min_range: 0.02
  max_range: 4.0
  field_of_view: 0.47
left:
  name: left_vl53l1x
  range_topic: /left/range
  distance_topic: /vl53l1x_distance_left
  frame_id: left_range_link
  min_range: 0.05
  max_range: 3.0
  field_of_view: 0.47
right:
  name: right_vl53l1x
  range_topic: /right/range
  distance_topic: /vl53l1x_distance_right
  frame_id: right_range_link
  min_range: 0.05
  max_range: 3.0
  field_of_view: 0.47
